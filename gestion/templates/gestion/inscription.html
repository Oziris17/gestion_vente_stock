{% extends 'gestion/base.html' %}
{% block title %}Créer un compte{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card card-custom p-4 shadow">
      <h4 class="fw-bold mb-3">Créer un compte client</h4>
      <form method="post">
        {% csrf_token %}
        {% include 'gestion/_champs.html' %}
        <button type="submit" class="btn btn-primary-custom btn-primary w-100 mt-4">Créer mon compte</button>
      </form>
      <p class="text-center small mt-3 mb-0">Déjà inscrit ? <a href="{% url 'login' %}">Se connecter</a></p>
    </div>
  </div>
</div>
{% endblock %}
