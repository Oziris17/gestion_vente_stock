{% extends 'gestion/base_boutique.html' %}
{% block title %}Créer un compte - Mon Magasin{% endblock %}
{% block content %}
<div class="max-w-md mx-auto px-margin py-space-xl md:py-space-xxl">
  <div class="rounded-xl bg-surface-container p-space-lg space-y-space-md">
    <h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">Créer un compte client</h1>

    <form method="post">
      {% csrf_token %}
      {% include 'gestion/_champs_boutique.html' %}
      <button type="submit" class="w-full h-12 rounded-lg bg-primary-container hover:bg-on-primary-fixed-variant text-on-primary font-label-lg text-label-lg transition-colors">Créer mon compte</button>
    </form>

    <p class="text-center font-body-sm text-body-sm text-on-surface-variant">
      Déjà inscrit ?
      <a href="{% url 'login' %}" class="text-primary-container hover:underline">Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
