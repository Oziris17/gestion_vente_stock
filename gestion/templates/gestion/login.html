{% extends 'gestion/base.html' %}

{% block title %}Connexion - GestionPro{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card card-custom p-4 shadow-lg">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                    <i class="bi bi-lock-fill fs-3"></i>
                </div>
                <h4 class="fw-bold text-dark">Espace Connexion</h4>
                <p class="text-muted small">Connectez-vous pour accéder à la gestion</p>
            </div>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label text-secondary small fw-semibold">Nom d'utilisateur</label>
                    <input type="text" name="username" class="form-control rounded-3" id="id_username" required placeholder="Entrez votre identifiant">
                </div>
                <div class="mb-4">
                    <label for="id_password" class="form-label text-secondary small fw-semibold">Mot de passe</label>
                    <input type="password" name="password" class="form-control rounded-3" id="id_password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary-custom btn-primary w-100 py-2 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Se connecter
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
