{% extends 'gestion/base.html' %}

{% block title %}Créer une Commande - GestionPro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-4 shadow-sm">
            <div class="d-flex align-items-center mb-4">
                <a href="{% url 'tableau_de_bord' %}" class="btn btn-light rounded-circle me-3">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h4 class="fw-bold text-dark mb-0">Enregistrer une commande</h4>
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="vstack gap-3">
                    {% for field in form %}
                    <div>
                        <label for="{{ field.id_for_label }}" class="form-label text-secondary small fw-semibold">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small mt-1">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>

                <div class="d-flex gap-2 mt-4 pt-2">
                    <button type="submit" class="btn btn-primary-custom btn-primary flex-fill py-2">
                        <i class="bi bi-check-circle me-2"></i>Enregistrer
                    </button>
                    <a href="{% url 'tableau_de_bord' %}" class="btn btn-outline-secondary px-4 py-2">Annuler</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
